name: Build NAS image

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require CAP_SYS_NICE in both compose files
        run: |
          grep -q 'SYS_NICE' compose.yaml
          grep -q 'SYS_NICE' compose.nas.yaml
      - uses: docker/setup-buildx-action@v3
      - name: Build the amd64 image used on the NAS
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: pagecatch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify segment retry and reject incomplete videos
        run: python3 deploy/verify-engine.py pagecatch:ci
      - name: Tag the artifact image
        if: github.event_name != 'pull_request'
        run: docker tag pagecatch:ci "pagecatch:gha-${GITHUB_SHA::7}"
      - name: Export the image for NAS import
        if: github.event_name != 'pull_request'
        run: docker save "pagecatch:gha-${GITHUB_SHA::7}" | gzip -1 > pagecatch-image.tar.gz
      - name: Upload the image artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pagecatch-image
          path: pagecatch-image.tar.gz
          retention-days: 14
          compression-level: 0
      - name: Publish to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pagecatch"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag pagecatch:ci "$image:${GITHUB_SHA}"
          docker tag pagecatch:ci "$image:latest"
          docker push "$image:${GITHUB_SHA}"
          docker push "$image:latest"
